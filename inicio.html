<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1017" />
<title>DocFill</title>
<style>
  :root{
    --fondo:#0b1017; --panel:#141c26; --linea:#26313f;
    --texto:#eaf1fb; --suave:#9fb0c6; --azul:#3b82f6; --amarillo:#ffce00;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:radial-gradient(120% 90% at 50% 0%, #16233a 0%, var(--fondo) 55%);
    color:var(--texto);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;flex-direction:column;
    padding:24px 18px calc(24px + env(safe-area-inset-bottom));
  }
  header{text-align:center;margin:8px 0 22px;}
  .marca{display:inline-flex;align-items:center;gap:10px;margin-bottom:14px;}
  .logo{
    width:42px;height:42px;border-radius:12px;
    background:linear-gradient(135deg,#4f8cff,#1e4fd8);
    display:grid;place-items:center;
    box-shadow:0 10px 26px rgba(31,79,216,.45);
  }
  .logo svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  h1{font-size:19px;margin:0;letter-spacing:.2px;}
  .sub{color:var(--suave);font-size:13.5px;margin:6px 0 0;line-height:1.45;}

  .opciones{display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center;max-width:520px;margin:0 auto;width:100%;}
  .opcion{
    display:flex;align-items:center;gap:15px;width:100%;
    background:linear-gradient(180deg,#18222f,#131b25);
    border:1px solid var(--linea);border-radius:18px;
    padding:20px 18px;color:var(--texto);text-align:left;
    font:inherit;cursor:pointer;transition:transform .12s ease,border-color .12s;
  }
  .opcion:active{transform:scale(.985);border-color:#3d4d63;}
  .opcion .icono{
    width:52px;height:52px;flex:0 0 52px;border-radius:14px;
    display:grid;place-items:center;background:#1d2a3c;
  }
  .opcion .icono svg{width:26px;height:26px;fill:none;stroke:#8fb8ff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .opcion.destacada{border-color:#2d4a7a;background:linear-gradient(180deg,#1b2a41,#141d29);}
  .opcion.destacada .icono{background:#23395c;}
  .opcion.destacada .icono svg{stroke:var(--amarillo);}
  .opcion h2{margin:0 0 3px;font-size:16px;font-weight:700;}
  .opcion p{margin:0;color:var(--suave);font-size:12.8px;line-height:1.4;}
  .flecha{margin-left:auto;color:#5b6d85;font-size:20px;}

  footer{text-align:center;color:#5d6d82;font-size:11.5px;margin-top:18px;line-height:1.5;}
</style>
</head>
<body>

<header>
  <div class="marca">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M6 2.8h7.2L19 8.6v12.6H6z"/><path d="M13 2.8v6h6"/><path d="M9 13h6M9 16.4h6"/></svg>
    </div>
    <h1>DocFill</h1>
  </div>
  <p class="sub">Captura los datos de una persona o edita un documento.</p>
</header>

<div class="opciones">
  <button class="opcion destacada" id="btnCapturar" type="button">
    <span class="icono">
      <svg viewBox="0 0 24 24"><path d="M12 3.5c-2.6 0-4.6 2-4.6 4.6v2.1"/><path d="M7.4 15.4v-5.2"/><path d="M12 3.5c2.6 0 4.6 2 4.6 4.6v5.3c0 3.6-2 6.6-4.6 6.6"/><path d="M16.6 15.6c0 2.2-.9 4-2.3 5.1"/><path d="M9.5 9.2c0-1.4 1.1-2.5 2.5-2.5s2.5 1.1 2.5 2.5v4.6c0 2.6-1.1 4.6-2.5 4.6"/><path d="M12 11.4v3.3"/></svg>
    </span>
    <span>
      <h2>Capturar foto, firma y huella</h2>
      <p>Foto con fondo blanco, firma dibujada o subida, y huella con el sensor.</p>
    </span>
    <span class="flecha">›</span>
  </button>

  <button class="opcion" id="btnEditar" type="button">
    <span class="icono">
      <svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10-3-3L5 16z"/><path d="M14.5 5.5l3 3"/><path d="M4 20h16"/></svg>
    </span>
    <span>
      <h2>Editar documento</h2>
      <p>Abre un PDF o una foto, escribe los datos una vez y exporta en alta resolución.</p>
    </span>
    <span class="flecha">›</span>
  </button>
</div>

<footer>Los datos se procesan en este teléfono. Nada se sube a internet.</footer>

<script>
  function b64u(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  document.getElementById('btnCapturar').addEventListener('click', () => {
    const payload = {
      t: 'local_' + Date.now().toString(36),
      label: 'Foto, firma y huella',
      steps: ['photo', 'signature', 'fingerprint'],
      ts: Math.floor(Date.now() / 1000),
    };
    location.href = 'captura.html#r=' + b64u(JSON.stringify(payload));
  });

  document.getElementById('btnEditar').addEventListener('click', () => {
    location.href = 'index.html';
  });
</script>
</body>
</html>
